<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วงล้อสุ่มร้านอาหาร</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ee;--ink:#2a1d17;--sub:#6e5b50;--card:#fff;--line:#e6d9c8;--accent:#c8321e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1612;--ink:#f6ebdd;--sub:#bda996;--card:#2a201a;--line:#43342b;--accent:#ff6a4d}}
:root[data-theme="dark"]{--bg:#1d1612;--ink:#f6ebdd;--sub:#bda996;--card:#2a201a;--line:#43342b;--accent:#ff6a4d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
h1{font-family:'Mitr',sans-serif;font-weight:500;font-size:clamp(26px,6vw,38px);margin:8px 0 4px;text-align:center}
.sub{color:var(--sub);margin:0 0 20px;text-align:center}
.stage{position:relative;width:min(88vw,420px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 6px var(--ink),0 12px 30px rgba(0,0,0,.2)}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--accent);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
button{font-family:'Mitr',sans-serif;font-size:20px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 44px;margin-top:28px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.result{margin-top:22px;min-height:84px;text-align:center;font-family:'Mitr',sans-serif}
.result .name{font-size:clamp(24px,6vw,32px);color:var(--accent)}
.result .note{font-family:'Sarabun',sans-serif;color:var(--sub);margin-top:4px}
.list{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
</style>
</head>
<body>
<h1>วันนี้กินร้านไหนดี?</h1>
<p class="sub">กดหมุนแล้วให้วงล้อเลือกให้</p>
<div class="stage"><div class="pointer"></div><canvas id="wheel" width="840" height="840"></canvas></div>
<button id="spin">หมุนเลย</button>
<div class="result" id="result" aria-live="polite"></div>
<div class="list" id="list"></div>
<script>
const items=[
 {name:"Wagyu Shoutalan",color:"#c8321e"},
 {name:"O-Jung Yakiniku",color:"#e08a1e"},
 {name:"Kanoki Roll",color:"#2f7d6b"},
 {name:"Din Tai Fung",note:"ร้านอาหารจีน · Central World",color:"#3b5ba5"},
 {name:"Bimbo",color:"#8a4fa8"}
];
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
const N=items.length,arc=2*Math.PI/N,R=cv.width/2;
let rot=0,busy=false;
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);
 items.forEach((it,i)=>{
  const a0=rot+i*arc-Math.PI/2,a1=a0+arc;
  ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-4,a0,a1);ctx.closePath();
  ctx.fillStyle=it.color;ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.stroke();
  ctx.save();ctx.translate(R,R);ctx.rotate(a0+arc/2);
  ctx.textAlign="right";ctx.fillStyle="#fff";
  ctx.font="600 38px Mitr, sans-serif";
  ctx.fillText(it.name,R-40,13);
  ctx.restore();
 });
 ctx.beginPath();ctx.arc(R,R,38,0,7);ctx.fillStyle="#fff";ctx.fill();
 ctx.lineWidth=6;ctx.strokeStyle="#2a1d17";ctx.stroke();
}
function spin(){
 if(busy)return;busy=true;
 document.getElementById('spin').disabled=true;
 document.getElementById('result').innerHTML="";
 const win=Math.floor(Math.random()*N);
 // pointer at top (angle 0 after -PI/2 offset); segment center must land there
 const target=-(win*arc+arc/2)+(Math.random()-.5)*arc*.7;
 const start=rot,total=((target-start)%(2*Math.PI)-2*Math.PI)+(-2*Math.PI)*(5+Math.floor(Math.random()*3));
 const dur=5000,t0=performance.now();
 (function f(t){
  const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,4);
  rot=start+total*e;draw();
  if(p<1)requestAnimationFrame(f);else{
   busy=false;document.getElementById('spin').disabled=false;
   document.getElementById('spin').textContent="หมุนอีกครั้ง";
   const w=items[win];
   document.getElementById('result').innerHTML='<div class="name">🍽️ '+w.name+'</div>'+(w.note?'<div class="note">'+w.note+'</div>':'<div class="note">ไปกินร้านนี้กัน!</div>');
  }
 })(t0);
}
document.getElementById('spin').onclick=spin;
document.getElementById('list').innerHTML=items.map(i=>'<span class="chip"><span class="dot" style="background:'+i.color+'"></span>'+i.name+'</span>').join('');
draw();
if(document.fonts)document.fonts.ready.then(draw);
</script>
</body>
</html>
